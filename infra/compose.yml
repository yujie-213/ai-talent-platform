name: ai-talent-stage1
services:
  mysql:
    image: mysql@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
    environment:
      MYSQL_DATABASE: talent
      MYSQL_USER: talent
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    ports: ["127.0.0.1:13306:3306"]
    volumes: ["mysql_stage1:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis@sha256:b362b5dff9d14d961dc3352db4776aba6a8c53ca2661d7c74ad2c121f82cdaea
    ports: ["127.0.0.1:16379:6379"]
    volumes: ["redis_stage1:/data"]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    image: ai-talent-stage1-backend:0.1.0
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment: &worker_env
      DATABASE_URL: mysql+pymysql://talent:${MYSQL_PASSWORD}@mysql:3306/talent
      BROKER_URL: redis://redis:6379/0
      FILE_ROOT: /workspace/data/files
    volumes: ["../backend:/workspace/backend:ro", "../data/files:/workspace/data/files"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
  dispatcher:
    image: ai-talent-stage1-backend:0.1.0
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: ["python", "-m", "app.cli", "dispatcher"]
    environment: *worker_env
    volumes: ["../backend:/workspace/backend:ro", "../data/files:/workspace/data/files"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  mysql_stage1:
  redis_stage1:
