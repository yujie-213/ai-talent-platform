function sendQA(preset){const input=$('qaInput');const q=preset||input?.value.trim();if(!q){toast('请先输入问题');return}const scope=state.scope||{ids:[state.profileId],label:'当前人才'},list=accessiblePeople().filter(p=>scope.ids.includes(p.id));if(!list.length){toast('范围为空，请明确选择人才');return}const key=profileScopeKey(),messages=state.chats[key]||[];messages.push({user:true,html:esc(q)});let html='';if(/多少|几人|人数/.test(q)){const matched=list.filter(p=>(!/本科/.test(q)||p.degree==='本科')&&(!/Python/i.test(q)||p.skills.includes('Python'))&&(!/3\s*年/.test(q)||(p.years!==null&&p.years>=3))&&(!/外部/.test(q)||p.kind==='external'));html=`<p><b>演示条件结果：${matched.length} 人</b></p><p>在明确的 ${list.length} 人内按人才去重。${/本科/.test(q)?'学历：本科；':''}${/Python/i.test(q)?'技能：Python；':''}${/3\s*年/.test(q)?'经验：至少3年；':''}年限缺失者不当作满足。</p><p>明细：${matched.map(p=>p.name).join('、')||'无符合条件者'}。</p><p class="muted">此原型仅演示上述预设条件，不执行任意自然语言查询。</p>`}else if(/学校|院校|毕业/.test(q)){html=list.map(p=>`<p><b>${esc(p.name)}：</b>${p.school==='未提供'?'没有提供可核对的院校记录。':'毕业院校记录为'+p.school+'，学历'+p.degree+'。'}</p>${citation(p,true)}`).join('')}else if(/比较/.test(q)){html=`<p><b>逐人证据比较 · ${list.length} 人</b></p>`+list.map(p=>`<p><b>${esc(p.name)}</b> · ${p.years===null?'经验年限未知':p.years+'年（简历声明）'}<br>${esc(p.evidence)}</p>${citation(p)}`).join('')+'<p>上述比较来自预设合成资料，不推断缺失能力。</p>'}else if(/项目|技能|证据|经验|落地/.test(q)){html=list.map(p=>`<p><b>${esc(p.name)} · ${esc(p.project)}</b></p><p>${esc(p.evidence)}</p>${citation(p)}<p class="muted">当前资料没有量化生产规模，不能据此确认大规模模型落地的完整经验。</p>`).join('')}else html='<p>这是交互原型，尚未连接真实AI。可尝试“毕业院校是什么”“有哪些项目证据”“比较当前范围人才”及预设条件人数问题。</p>';messages.push({user:false,html});state.chats[key]=messages;if(input)input.value='';paintChat()}

function jobOverview(j){return `<div class="grid2">${card('岗位信息',`<div class="kv"><div><span>工作地点</span>${j.location||'草稿未填写'}</div><div><span>薪资</span>${j.salary||'草稿未填写'}</div></div><h3>岗位职责</h3><p class="notice section-gap">${esc(j.duties)}</p><h3 class="section-gap">任职要求</h3><p class="notice section-gap">${esc(j.description)}</p>`)}${card('匹配条件',`<div class="row"><span class="tiny">必备技能</span><div class="tags">${j.must.map(s=>badge(s,'blue')).join('')}</div></div><div class="row"><span class="tiny">加分技能</span><div class="tags">${j.nice.map(s=>badge(s)).join('')||'不限'}</div></div><div class="row tiny"><span>最低学历</span><b>${j.degree}</b></div><div class="row tiny"><span>最低工作年限</span><b>${j.years?j.years+'年':'不限'}</b></div><p class="notice section-gap">简历声明可作为技能依据。时间条件须有记录，缺失归为待核对。</p>`)}</div><div class="banner section-gap ${j.status!=='active'?'amber':''}">${j.status==='active'?'保存需求不自动匹配。点击发起后固定岗位版本、人才范围和资料快照。':'当前为'+jobLabel(j.status)+'，不能发起新匹配。请先补齐表单并确认生效。'}</div><div class="actions section-gap">${state.role==='hr'?btn('发起新匹配','match-start',j.id,true,j.status==='active'?'':'disabled'):''}${btn('查看已有结果','job-tab','matching')}${btn('查看历史快照','job-tab','history')}</div>`}
function evaluate(p,j){const missing=j.must.filter(s=>!p.skills.includes(s)),levels=['未知','高中','大专','本科','硕士','博士'],educationFail=p.degree!=='未知'&&j.degree!=='不限'&&levels.indexOf(p.degree)<levels.indexOf(j.degree),yearsFail=p.years!==null&&p.years<j.years,unknown=p.years===null||p.degree==='未知'||missing.length>0,fail=yearsFail||educationFail;return {person:structuredClone(p),group:fail?'fail':unknown?'unknown':'pass',score:p.score,missing,reason:yearsFail?'明确工作年限低于要求':educationFail?'已提供学历低于最低要求':missing.length?'必备技能证据不足，需核对：'+missing.join('、'):unknown?'学历或工作年限缺少证据':'已提供的学历、年限及必备技能记录满足条件'}}
function getRun(j){const run=runs.find(r=>r.id===state.runId&&r.jobId===j.id)||[...runs].reverse().find(r=>r.jobId===j.id);if(run&&!run.entries.length)run.entries=run.people.map(p=>evaluate(p,run.jobSnapshot||j));return run}
function matchPage(j){const run=getRun(j);if(!run)return card('匹配结果',`<div class="empty">还没有保存的匹配结果<br>${j.status==='active'?'可以基于当前有效版本发起':'先确认有效岗位版本后再发起'}。</div><div class="actions">${state.role==='hr'?btn('发起新匹配','match-start',j.id,true,j.status==='active'?'':'disabled'):''}</div>`);const groups={pass:'满足条件',unknown:'待核对',fail:'不满足',all:'全部'};const entries=run.entries.filter(e=>state.matchGroup==='all'||e.group===state.matchGroup).sort((a,b)=>b.score-a.score);let focus=run.entries.find(e=>e.person.id===state.entryId&&entries.includes(e))||entries[0];if(focus)state.entryId=focus.person.id;return `<div class="run-summary"><div>需求 v${run.version} · ${run.time} · 固定范围 ${run.entries.length} 人<br><small class="muted">演示评分 · ${run.rules} · 分数不等于录用概率</small></div><div class="actions">${run.version!==j.version?badge('岗位已有新版本 · 旧结果','amber'):badge('当前岗位版本','green')}${state.role==='hr'?btn('发起新匹配','match-start',j.id,true,j.status==='active'?'':'disabled'):''}</div></div><div class="actions" style="margin-bottom:14px">${Object.entries(groups).map(([k,v])=>`<button class="chip ${state.matchGroup===k?'on':''}" data-action="match-group" data-id="${k}">${v} ${k==='all'?run.entries.length:run.entries.filter(e=>e.group===k).length}</button>`).join('')}</div><div class="result-layout">${card('候选人结果',entries.map(e=>`<div class="rank-item ${focus?.person.id===e.person.id?'active':''}" data-action="entry" data-id="${e.person.id}" role="button" aria-label="查看${e.person.name}匹配解释" tabindex="0"><div class="score ${e.group==='unknown'?'unknown':e.group==='fail'?'fail':''}">${e.score}</div><div class="grow"><h3>${e.person.name} · ${e.person.degree} · ${e.person.years===null?'年限未知':e.person.years+'年'}</h3><p>${esc(e.reason)}</p></div>${badge(groups[e.group],e.group==='pass'?'green':e.group==='unknown'?'amber':'red')}</div>`).join('')||'<div class="empty">该分组没有结果</div>',badge(entries.length+'人'))}${card('匹配解释与证据',focus?entryExplanation(focus,run.jobSnapshot||j,run):'<div class="empty">选择一位人才查看依据</div>')}</div>`}
function entryExplanation(e,j,run){return `<div class="row" style="padding-top:0"><div><h3>${e.person.name}</h3><p>匹配时档案 v1 · ${e.person.kind==='internal'?'内部员工':'外部候选人'}</p></div>${state.role==='hr'?btn('打开画像','match-profile',e.person.id):''}</div><div class="check-row"><div><b>必备技能</b>${badge(e.missing.length?'信息不足':'有记录支持',e.missing.length?'amber':'green')}</div><p>${e.missing.length?'缺少记录：'+e.missing.join('、'):'简历声明：'+j.must.join('、')}</p></div><div class="check-row"><div><b>学历与工作年限</b>${badge(e.group==='unknown'?'信息不足':e.person.years!==null&&e.person.years<j.years?'年限不足':'已核对',e.group==='unknown'?'amber':'blue')}</div><p>${e.person.degree} · ${e.person.years===null?'年限未提供':e.person.years+'年（简历声明）'}</p></div><div class="fact"><h3>项目证据</h3><p>${e.person.evidence}</p>${citation(e.person)}</div><div class="banner ${e.group==='pass'?'':'amber'}">${e.reason}。结论仅用于辅助排序，按实际证据核对。</div><details><summary>本次范围与历史版本</summary><p>岗位v${run.version} · 档案v1 · ${run.rules}<br>范围在发起时固定，修改档案后应新建匹配，不覆盖本次结果。</p></details>`}

function saveJob(id,activate){const value={title:$('j-title').value.trim(),department:$('j-dept').value,position:$('j-position').value,location:$('j-location').value.trim(),salary:$('j-salary').value.trim(),duties:$('j-duties').value.trim(),description:$('j-description').value.trim(),must:$('j-must').value.split(/[,，、]/).map(s=>s.trim()).filter(Boolean),nice:$('j-nice').value.split(/[,，、]/).map(s=>s.trim()).filter(Boolean),degree:$('j-degree').value.trim()||'不限',years:Math.max(0,Number($('j-years').value)||0),jd:$('j-jd').value};if(activate&&(!value.title||!value.location||!value.salary||!value.duties||!value.description||!$('j-confirm').checked)){$('jobError').textContent='请补齐名称、地点、薪资、职责、要求，并勾选一致性确认。输入已保留。';return}let j=jobs.find(j=>j.id===Number(id));if(!j){j={id:Math.max(...jobs.map(x=>x.id))+1,status:'draft',version:0,editVersion:0};jobs.push(j)}if(!activate&&j.status==='active'){j.draftPreview=value;j.editVersion++;toast('演示：草稿已保存，当前有效版本不变')}else{Object.assign(j,value);j.editVersion++;if(activate){j.version++;j.status='active';delete j.draftPreview}else j.status='draft';toast(activate?'演示：已生成新的有效版本':'演示：草稿已保存')}state.jobId=j.id;state.jobTab='overview';closeModal();render()}

let currentExam=null;
function examOpen(id){const a=assignments.find(a=>a.id===Number(id));if(state.role==='employee'&&a.person!==8){toast('演示视角只查看本人任务');return}currentExam=a.id;if(a.state==='completed'){const d=a.result.dimensions;modal('测评成绩 · '+people.find(p=>p.id===a.person).name,`<div class="banner">${a.title} · 试卷 v${a.version} · 历史规则成绩</div><div style="text-align:center;padding:24px 0"><strong style="font-size:42px;color:var(--brand)">${a.result.total}</strong><span class="muted"> / ${a.result.maximum}</span><p class="notice">已完成 · 答案锁定 · 合成结果</p></div><h3>本次实测维度</h3>${Object.entries(d).map(([k,v])=>`<div class="dimension-line"><div><span>${k}</span><b>${v.score} / ${v.max}</b></div><div class="progress-track"><i style="width:${Math.round(v.score/v.max*100)}%"></i></div></div>`).join('')}<p class="notice section-gap">只展示本试卷实测维度。其他能力为未测评，不外推软素质、不自动加入岗位匹配分。</p>`,btn('关闭','close')+(state.role!=='admin'?btn('查看对应档案','profile',a.person):''));return}if(state.role!=='employee'){modal('测评任务',`<div class="kv"><div><span>参与人</span>${people.find(p=>p.id===a.person).name}</div><div><span>状态</span>${statusLabel(a.state)}</div><div><span>试卷</span>${a.title} v${a.version}</div><div><span>提交规则</span>提交后锁定，客观规则评分</div></div><div class="banner">HR查看任务进展；可切换“员工”演示视角体验答题。</div>`);return}modal('我的测评 · '+a.title,`<div class="banner">固定试卷 v${a.version} · 单/判断题选一个，多选完全正确得分，未答计零分。提交后答案锁定。</div><div class="section-gap">${a.questions.map((q,i)=>`<section class="question"><h3>${i+1}. ${q.title} <span class="muted tiny">${q.kind==='multiple'?'多选':'单选/判断'} · ${q.points}分</span></h3>${q.options.map((o,n)=>`<label class="radio-row"><input type="${q.kind==='multiple'?'checkbox':'radio'}" name="${q.id}" value="${n}" ${(a.draft[q.id]||[]).includes(n)?'checked':''}>${esc(o)}</label>`).join('')}</section>`).join('')}</div>`,btn('稍后继续','close')+btn('保存草稿','exam-save')+btn('提交答案','exam-submit','',true),true)}
function readAnswers(a){return Object.fromEntries(a.questions.map(q=>[q.id,[...document.querySelectorAll(`[name="${q.id}"]:checked`)].map(x=>Number(x.value))]))}
function submitExam(){const a=assignments.find(a=>a.id===currentExam);if(a.state==='completed'){examOpen(a.id);return}const answers=readAnswers(a),blank=Object.values(answers).filter(v=>!v.length).length;a.draft=answers;modal('确认提交测评',`<p>${blank?'还有 '+blank+' 道题未答，将计零分。':'已完成所有题目。'}提交后锁定答案，按固定规则评分，不能修改最终答案。</p>`,btn('返回答题','exam-open',a.id)+btn('确认提交','exam-confirm',a.id,true))}
function gradeExam(id){const a=assignments.find(a=>a.id===Number(id));if(a.state==='completed'){examOpen(id);return}const dimensions={};let total=0;for(const q of a.questions){const got=[...(a.draft[q.id]||[])].sort(),right=[...q.correct].sort(),score=JSON.stringify(got)===JSON.stringify(right)?q.points:0;total+=score;dimensions[q.dimension]??={score:0,max:0};dimensions[q.dimension].score+=score;dimensions[q.dimension].max+=q.points}a.result={total,maximum:a.questions.reduce((s,q)=>s+q.points,0),dimensions};a.answers=structuredClone(a.draft);a.state='completed';render();examOpen(a.id)}

case 'job-activate':saveJob(id,true);break;
case 'jd-load':$('j-jd').value=jobs[0].jd;toast('已载入合成JD示例');break;
case 'jd-assist':if(!$('j-jd').value.trim()){toast('请先粘贴JD或载入示例');break}$('jdSuggestions').innerHTML=`<div class="banner amber"><b>预设演示建议：</b>地点“西安 · 高新区”，必备Python、MySQL；RAG、Docker为加分项。<br>已有手工输入不会自动覆盖。${btn('采纳演示建议','jd-adopt')}</div>`;break;
case 'jd-adopt':if(!$('j-location').value)$('j-location').value='西安 · 高新区';if(!$('j-salary').value)$('j-salary').value='12–20K CNY / 月';if(!$('j-title').value)$('j-title').value='AI 应用开发工程师';$('j-must').value='Python，MySQL';$('j-nice').value='RAG，Docker';$('jdSuggestions').innerHTML='<div class="banner">已采纳演示建议。请核对全文与结构化条件，其他人工输入保留。</div>';break;
case 'match-start':matchStart(id);break;
case 'match-confirm':{const j=jobs.find(j=>j.id===Number(id)),mixed=document.querySelector('[name=matchScope]:checked').value==='mixed',list=people.filter(p=>p.kind==='external'||mixed&&p.department!==j.department),r={id:Date.now(),jobId:j.id,version:j.version,time:'刚刚 · 原型演示',rules:'v3 · 演示规则',jobSnapshot:structuredClone(j),people:structuredClone(list),entries:list.map(p=>evaluate(p,j))};runs.push(r);state.runId=r.id;state.entryId=r.entries.find(e=>e.group==='pass')?.person.id||r.entries[0]?.person.id;state.jobTab='matching';state.matchGroup='pass';closeModal();render();toast('演示匹配完成，预设评分不代表真实算法效果');break}
case 'match-group':state.matchGroup=id;render();break;
case 'entry':state.entryId=Number(id);render();break;
case 'run-open':state.runId=Number(id);state.jobTab='matching';state.matchGroup='all';render();break;
case 'match-profile':openProfile(id);break;
case 'exam-tab':state.examTab=id;render();break;
case 'exam-open':examOpen(id);break;
case 'exam-save':{const a=assignments.find(a=>a.id===currentExam);a.draft=readAnswers(a);a.state='answering';toast('演示草稿已保存，可稍后继续');break}
case 'exam-submit':submitExam();break;
case 'exam-confirm':gradeExam(id);break;
case 'assign':modal('分配固定版本测评',`<div class="field"><label for="assignPaper">已发布试卷</label><select id="assignPaper">${papers.map(p=>`<option value="${p.id}">${esc(p.title)} · v${p.version}</option>`).join('')}</select></div><div class="field section-gap"><label for="assignPerson">已绑定账号的员工</label><select id="assignPerson"><option value="8">陆景行 · demo.employee</option><option value="9">顾清禾 · 合成员工</option></select></div><p class="notice section-gap">只分配给已绑定账号的员工；切换员工演示视角可作答。</p>`,btn('取消','close')+btn('确认分配','assign-save','',true));break;
case 'assign-save':{const paper=papers.find(p=>p.id===Number($('assignPaper').value));assignments.unshift({id:Date.now(),paper:paper.id,person:Number($('assignPerson').value),title:paper.title,version:paper.version,state:'pending',draft:{},answers:null,result:null,questions:structuredClone(paper.questions)});closeModal();render();toast('演示：已分配固定版本测评');break}
case 'question-edit':questionEdit(id);break;
case 'question-save':{const title=$('q-title').value.trim(),options=$('q-options').value.split('\n').filter(Boolean),correct=$('q-answer').value.split(/[,，]/).map(n=>Number(n)-1),dimension=$('q-dimension').value.trim();if(!title||!dimension||options.length<2||correct.some(n=>!Number.isInteger(n)||n<0||n>=options.length)){toast('请填写题干、维度及有效选项序号');break}let q=questions.find(q=>q.id===id);const data={title,options,correct,dimension,points:Math.max(1,Number($('q-points').value)||10),kind:correct.length>1?'multiple':'single'};if(q)Object.assign(q,data);else questions.push({id:'q'+Date.now(),...data});closeModal();render();toast('演示：题库已保存，历史试卷不变');break}
case 'paper-view':{const p=papers.find(p=>p.id===Number(id));modal('已发布试卷 · v'+p.version,`<div class="banner">发布快照不可原地修改，新增发布生成新版本。</div>`+p.questions.map((q,i)=>`<div class="fact"><h3>${i+1}. ${q.title}</h3><p>${q.options.join(' / ')}<br>正确选项：${q.correct.map(n=>n+1).join('、')} · ${q.dimension} · ${q.points}分</p></div>`).join(''));break}
case 'paper-publish':modal('发布新试卷版本',`<p>将当前题库 ${questions.length} 道题发布为“后端业务基础测评”的新版本。既有分配任务保持原快照。</p>`,btn('取消','close')+btn('确认发布新版本','paper-confirm','',true));break;
case 'paper-confirm':papers.push({id:Date.now(),title:'后端业务基础测评',version:Math.max(...papers.map(p=>p.version))+1,questions:structuredClone(questions)});closeModal();render();toast('演示：已发布新版本');break;
case 'system-open':state.systemTab=id;nav('system');break;
case 'system-tab':state.systemTab=id;render();break;
case 'catalog-tab':state.catalogTab=id;render();break;
case 'catalog-add':modal('新增基础资料',state.catalogTab==='departmentPositions'?`<div class="form-grid"><div class="field"><label for="catalogDept">所属部门</label><select id="catalogDept">${catalogItems.departments.map(d=>`<option>${esc(d)}</option>`).join('')}</select></div><div class="field"><label for="catalogPosition">公司岗位</label><select id="catalogPosition">${catalogItems.positions.map(d=>`<option>${esc(d)}</option>`).join('')}</select></div></div>`:field('名称','catalogName'),btn('取消','close')+btn('保存','catalog-save','new',true));break;
case 'catalog-edit':modal('修改基础资料名称',field('名称','catalogName',catalogItems[state.catalogTab][Number(id)]),btn('取消','close')+btn('保存','catalog-save',id,true));break;
case 'catalog-save':{const n=$('catalogName')?$('catalogName').value.trim():$('catalogDept').value+' · '+$('catalogPosition').value;if(!n){toast('名称不能为空');break}if(id==='new'&&catalogItems[state.catalogTab].includes(n)){toast('同一基础资料已存在');break}if(id==='new')catalogItems[state.catalogTab].push(n);else catalogItems[state.catalogTab][Number(id)]=n;closeModal();render();toast('演示配置已保存');break}
case 'catalog-disable':modal('停用基础资料',`<p>停用“${esc(catalogItems[state.catalogTab][Number(id)])}”将阻止新增归属，历史记录继续保留。</p>`,btn('取消','close')+btn('确认停用','catalog-disable-confirm',id));break;
case 'catalog-disable-confirm':disabledCatalog.add(state.catalogTab+':'+id);closeModal();render();toast('演示：已停用，历史保留');break;
case 'catalog-enable':disabledCatalog.delete(state.catalogTab+':'+id);render();toast('演示：已启用');break;
case 'account-edit':accountEdit(id);break;
case 'account-save':{if(!$('a-name').value.trim()||!$('a-user').value.trim()){toast('名称与账号不能为空');break}const data={name:$('a-name').value.trim(),username:$('a-user').value.trim(),role:$('a-role').value,bind:$('a-bind').value,department:$('a-dept').value,enabled:$('a-enabled').checked};let a=accounts.find(a=>a.id===Number(id));if(a)Object.assign(a,data);else accounts.push({id:Date.now(),...data});closeModal();render();toast('仅保存演示账号配置，不创建真实账号');break}
case 'role-new':modal('新增角色',field('角色名称','newRoleName')+'<p class="notice section-gap">默认无功能授权，创建后配置功能和明确数据范围。</p>',btn('取消','close')+btn('创建角色','role-create','',true));break;
case 'role-create':{const name=$('newRoleName').value.trim();if(!name||roles.some(r=>r.name===name)){toast('请输入不重复的角色名称');break}roles.push({name,scope:'本人（未授权功能）',rights:[]});closeModal();render();toast('演示：角色已建立，默认无功能授权');break}
case 'menu-edit':modal('菜单显示预览',`<div class="field"><label for="menuRole">预览角色</label><select id="menuRole"><option value="hr">HR</option><option value="employee">员工</option><option value="lead">业务负责人</option><option value="admin">管理员</option></select></div><div class="role-rights section-gap">${Object.entries(labels).map(([k,v])=>`<label><input type="checkbox" name="menuChoice" value="${k}" ${menuPreview.hr.includes(k)?'checked':''}>${v}</label>`).join('')}</div><p class="notice section-gap">只更新本页配置表的预览，固定演示角色的业务权限不随此表单变化。正式版显示结果还要与功能权限取交集。</p>`,btn('取消','close')+btn('保存预览','menu-save','',true));break;
case 'menu-save':menuPreview[$('menuRole').value]=[...document.querySelectorAll('[name=menuChoice]:checked')].map(x=>x.value);closeModal();render();toast('演示菜单表已更新，正式权限未改变');break;
case 'role-edit':{const r=roles[Number(id)];modal('角色与数据范围 · '+r.name,`<div class="field"><label for="roleScope">数据范围</label><input id="roleScope" value="${esc(r.scope)}"></div><h3 class="section-gap">功能授权</h3><div class="role-rights section-gap">${['人才查看','人才维护','简历导入','档案问答','岗位维护','匹配执行','测评管理','本人档案','本人测评','账号管理','组织基础资料','角色权限','菜单管理','日志查看'].map(v=>`<label><input name="roleRight" type="checkbox" value="${v}" ${r.rights.includes(v)?'checked':''}>${v}</label>`).join('')}</div><p class="notice section-gap">此处仅配置预览；右上角演示角色使用固定权限场景，不将输入文字当作正式鉴权规则。</p>`,btn('取消','close')+btn('保存演示配置','role-save',id,true));break}
case 'role-save':roles[Number(id)].scope=$('roleScope').value;roles[Number(id)].rights=[...document.querySelectorAll('[name=roleRight]:checked')].map(x=>x.value);closeModal();render();toast('角色配置预览已保存，未修改正式授权');break;
case 'log-filter':$('logRows').innerHTML=logTable(logs.filter(l=>!$('logType').value||l.kind===$('logType').value));break;
default:toast('此操作未纳入本版原型')
}}
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(el&&!el.disabled)handle(el.dataset.action,el.dataset.id,el)});
document.addEventListener('keydown',event=>{if(event.key==='Escape')closeModal();if(event.key==='Enter'&&event.target.matches('.rank-item'))handle('entry',event.target.dataset.id,event.target)});
document.addEventListener('change',event=>{if(event.target.id==='menuRole'){document.querySelectorAll('[name=menuChoice]').forEach(input=>input.checked=menuPreview[event.target.value].includes(input.value))}if(event.target.matches('[data-person]')){const id=Number(event.target.dataset.person);event.target.checked?state.selected.add(id):state.selected.delete(id);const scroll=$('app').scrollTop;render();$('app').scrollTop=scroll}});
document.addEventListener('submit',event=>{if(event.target.id==='filterForm'){event.preventDefault();state.filters=Object.fromEntries(new FormData(event.target));state.pageNo=1;state.selected.clear();render()}});
$('role').addEventListener('change',event=>{closeModal();state.role=event.target.value;state.profileTab='facts';state.tagTab='all';state.selected.clear();state.scope=null;state.chats={};state.profileId=state.role==='employee'?8:1;state.profileReturn=null;state.page='home';render();$('app').scrollTop=0});
if(allowedPages().includes(location.hash.slice(1)))state.page=location.hash.slice(1);
render();
</script>
</body></html>
