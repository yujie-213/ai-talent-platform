# 与 compose.yml 合用；只更新本项目 Worker，保留已有库和卷。
services:
  worker:
    image: ai-talent-stage2-backend:0.2.1
    build:
      context: ..
      dockerfile: infra/Dockerfile.stage2
    environment:
      RESUME_LLM_BASE_URL: ${RESUME_LLM_BASE_URL:-}
      RESUME_LLM_MODEL: ${RESUME_LLM_MODEL:-}
      RESUME_LLM_API_KEY: ${RESUME_LLM_API_KEY:-}
      OLLAMA_URL: http://host.docker.internal:11434
      MILVUS_URL: http://host.docker.internal:19530
      EMBEDDING_EXPECTED_DIGEST: ${EMBEDDING_EXPECTED_DIGEST:-}
    volumes:
      - ocr_stage2:/root/.paddlex
  indexer:
    image: ai-talent-stage2-backend:0.2.1
    command: ["python", "-m", "app.cli", "indexer"]
    environment:
      DATABASE_URL: mysql+pymysql://talent:${MYSQL_PASSWORD}@mysql:3306/talent
      FILE_ROOT: /workspace/data/files
      OLLAMA_URL: http://host.docker.internal:11434
      MILVUS_URL: http://host.docker.internal:19530
      EMBEDDING_EXPECTED_DIGEST: ${EMBEDDING_EXPECTED_DIGEST:-}
    volumes: ["../backend:/workspace/backend:ro"]
    depends_on:
      mysql: {condition: service_healthy}
volumes:
  ocr_stage2:
